name: ML Research Dataset

on:
  # Scheduled by the Cloudflare Worker (cloudflare/hl-manage-worker/worker.js),
  # collect every 4h at :10 (00:10, 04:10, …), label at 01:15, 05:15, …. This workflow is now manual only: Actions tab -> Run workflow.
  workflow_dispatch:
    inputs:
      job:
        description: Research operation (writes to Neon)
        type: choice
        options: [collect, label]
        default: label

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ml-research-dataset
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bounded research operation
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEARCH_JOB: ${{ github.event_name == 'workflow_dispatch' && inputs.job || (github.event.schedule == '10 */4 * * *' && 'collect' || 'label') }}
        run: python scripts/ml_research_schedule.py
