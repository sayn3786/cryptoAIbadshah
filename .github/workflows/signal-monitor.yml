name: Signal Outcome Monitor

on:
  schedule:
    # All times UTC. Signals are published on 2H candles, so hourly catches
    # every close without ever acting on a forming candle. The endpoint is
    # idempotent — each decision is keyed on the CANDLE that caused it — so an
    # extra run records nothing new and a missed run loses nothing.
    #
    # The FIRST scheduled tick resolves everything already in the database:
    # genuine target/stop hits are recorded, and anything older than the server
    # default (72h) is EXPIRED. Expired is terminal but is NOT a loss — it is
    # excluded from the win rate — so a backlog of stale signals resolves
    # honestly rather than being scored against the strategy.
    - cron: '5 * * * *'
  workflow_dispatch:        # also triggerable by hand from the Actions tab
    inputs:
      max_age_hours:
        description: >-
          How old a signal may get before it is EXPIRED. Use 720 (30 days) on the
          first run so only genuine target/stop hits are recorded and nothing
          ages out before you have seen what the monitor decides. Leave blank
          afterwards for the server default of 72.
        required: false
        default: '720'

jobs:
  monitor-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Advance open signals against the market
        run: |
          # Scheduled runs send no inputs, so this is empty there and the server
          # default applies.
          QS=""
          if [ -n "${{ inputs.max_age_hours }}" ]; then
            QS="?max_age_hours=${{ inputs.max_age_hours }}"
          fi
          echo "Calling: ${{ secrets.APP_URL }}/api/signals/monitor$QS"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/signals/monitor$QS" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 120)
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"
          # 503 means no database is configured — that is a deployment choice,
          # not a failure of this job. Anything else non-200 is a real problem.
          if [ "$HTTP_STATUS" = "503" ]; then
            echo "Persistence not configured — nothing to monitor."
            exit 0
          fi
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: API returned HTTP $HTTP_STATUS"
            exit 1
          fi
