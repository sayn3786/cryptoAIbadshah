name: Signal Outcome Monitor

on:
  schedule:
    # All times UTC. Signals are published on 2H candles, so hourly catches
    # every close without ever acting on a forming candle. The endpoint is
    # idempotent — each decision is keyed on the CANDLE that caused it — so an
    # extra run records nothing new and a missed run loses nothing.
    #
    # The FIRST scheduled tick resolves everything already in the database:
    # genuine target/stop hits are recorded, and anything older than the server
    # default (72h) is EXPIRED. Expired is terminal but is NOT a loss — it is
    # excluded from the win rate — so a backlog of stale signals resolves
    # honestly rather than being scored against the strategy.
    #
    # Every 30 minutes, not hourly. One run gets through roughly 30 signals
    # inside its budget, and there are about 65 working at a time — so hourly
    # left each signal checked only every other run. Twice an hour covers them
    # all, and the work rotates stalest-first so nothing is starved either way.
    - cron: '5,35 * * * *'
  workflow_dispatch:        # also triggerable by hand from the Actions tab
    inputs:
      max_age_hours:
        description: >-
          HOURS a signal may go unresolved before it is EXPIRED. Blank uses the
          server default of 72 (3 days), which is what scheduled runs use — leave
          it blank unless you have a reason. 720 is 30 days and effectively
          disables expiry; that is only useful for a one-off run meant to record
          genuine target and stop hits without ageing anything out. Unrelated to
          how long closed trades stay VISIBLE in the tracker — that is a
          separate 3-day window on the view.
        required: false
        default: ''

jobs:
  monitor-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Advance open signals against the market
        env:
          APP_URL:     ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MAX_AGE:     ${{ inputs.max_age_hours }}
        run: |
          # Scheduled runs send no inputs, so this is empty there and the server
          # default applies.
          QS=""
          if [ -n "$MAX_AGE" ]; then
            QS="?max_age_hours=$MAX_AGE"
          fi
          # Never echo the URL (it is a secret) or the raw body (it could carry a
          # DB error string). Capture status and body, then let the sanitizing
          # gate decide the exit code and print an allow-listed summary.
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "$APP_URL/api/signals/monitor$QS" \
            -H "x-cron-secret: $CRON_SECRET" \
            --max-time 120)
          HTTP_STATUS=$(printf '%s' "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(printf '%s' "$RESPONSE" | sed '/HTTP_STATUS:/d')
          # The gate is fail-closed: only DB_NOT_CONFIGURED is a healthy no-op;
          # DB_UNAVAILABLE / DB_NOT_MIGRATED / auth / any non-200 / a 200 with a
          # non-empty errors[] all exit non-zero so the run goes RED and visible.
          export HTTP_STATUS BODY
          python backend/monitor_gate.py
          exit $?
