name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: publication_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Python syntax check (compile all sources)
        run: python -m compileall -q backend tests

      - name: Run tests
        run: python -m pytest

      - name: Publication batch PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:disposable_test_only@localhost:5432/publication_test?sslmode=disable
          PYTHON_DOTENV_DISABLED: '1'
          DISABLE_REC_SCHEDULER: '1'
        run: python -m pytest tests/test_publication_batch_postgres.py -q
