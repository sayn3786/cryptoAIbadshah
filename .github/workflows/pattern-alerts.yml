name: Pattern Confirmation Alerts

on:
  # Scheduled by the Cloudflare Worker (cloudflare/hl-manage-worker/worker.js),
  # 00:15, 08:15 and 16:15 UTC. GitHub's own schedules were best-effort (hours late or skipped),
  # so this workflow is now manual only: Actions tab -> Run workflow.
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  send-pattern-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Scan for confirmed patterns and push to Telegram
        run: |
          echo "Calling: ${{ secrets.APP_URL }}/api/patterns/alert"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/patterns/alert" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 90)
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: API returned HTTP $HTTP_STATUS"
            exit 1
          fi
