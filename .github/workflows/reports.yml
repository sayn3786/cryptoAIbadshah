name: Weekly Report (private Telegram)

# The weekly performance summary (signals, win rate, expectancy, paper account,
# Hyperliquid testnet P&L) goes to the owner's PRIVATE Telegram chat
# (TELEGRAM_REPORT_CHAT_ID). This repo is public, so its Actions logs are too:
# this workflow never prints report data, only whether the send worked.
#
# Scheduled by the Cloudflare Worker (cloudflare/hl-manage-worker/worker.js),
# Sundays 06:17 UTC. This workflow is the manual trigger: Actions tab -> Run
# workflow. The app sends at most once per ISO week, so a manual run after the
# scheduled one reports "skipped".

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send this week's report
        env:
          APP_URL:     ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Never echo the URL (a secret) or the body beyond the allow-listed
          # outcome fields: the report itself must not reach this public log.
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "$APP_URL/api/cron/weekly-report" \
            -H "x-cron-secret: $CRON_SECRET" \
            --max-time 90)
          HTTP_STATUS=$(printf '%s' "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(printf '%s' "$RESPONSE" | sed '/HTTP_STATUS:/d')
          printf '%s' "$BODY" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              print("non-JSON response"); sys.exit(0)
          print({k: d[k] for k in ("ok", "week", "result", "error_code", "errors") if k in d})
          '
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Weekly report returned HTTP $HTTP_STATUS"
            exit 1
          fi
