name: Strategy backtests (private Telegram)

# Offline backtests of the live strategy, sent to the owner's PRIVATE Telegram
# chat (TELEGRAM_REPORT_CHAT_ID). Pick one with the `study` input:
#
#   cadence  would publishing / executing every 1h or 2h beat today's 4h?
#            (backend/cadence_compare.py)
#   stops    are v53's stops too tight? Same trades, stop moved further out
#            (x1.25, x1.5, x2, +0.5 / +1 ATR) plus how many stop-outs reached
#            TP1 afterwards (backend/stop_compare.py)
#   entry-exit  block trades against the Fibonacci pocket / where structure
#            fought the trade, and try exit shapes (30/70, stop to entry at 1R,
#            no break-even, all at TP1, all at TP2), executed the way HL does
#            (backend/entry_exit_compare.py)
#   combined  the best exit + stop together, with realistic HL costs (limit
#            take-profits too), split into 62-68 / 69+ signal strength
#            (backend/combined_compare.py)
#   v54-oos  out-of-sample check: today vs the FIXED v54 candidate on an
#            earlier period that ends `end_days_ago` days back (default 135,
#            so it doesn't overlap the run that picked v54)
#            (backend/combined_compare.py --fixed)
#   universe  more coins (the browse-only ones too) and/or every 69+ signal per
#            slot instead of the top 3, under HL's caps and without them; set
#            end_days_ago to 0 and to 135 for both periods
#            (backend/universe_compare.py; ~35-50 min with the extra coins)
#   rr       the live setup's reward-to-risk: no ATR widening, TPs scaled with
#            the stop, a minimum reward at the fill (0.5/0.8/1R), and risk-based
#            position sizing; set end_days_ago to 0 and to 135 for both periods
#            (backend/rr_compare.py)
#   reads    event study of the Daily Market Update reads: what each 1D / 1W
#            read (and a star confluence) did over the next 1-14 days, against
#            an ordinary day; ~4 years of daily history (backend/read_study.py)
#   read-filters  the event study's findings as filters on the live HL book
#            (no longs on a 1D forming bullish divergence / after a 1D cross
#            below EMA 50, no shorts on 2+ bullish weekly reads, weekly-backed
#            longs first); set end_days_ago to 0 and to 135
#            (backend/read_filter_compare.py)
#   factors  trade-outcome factor study: every candidate over ~260 days, v54
#            execution, ~25 factors known at entry WITH vs WITHOUT in each
#            half; only factors consistent in both are reported as candidates
#            (backend/factor_study.py; ~40-60 min)
#   strength  the factor study's consistent factors as strength changes on the
#            live HL book; set end_days_ago to 0 and to 135
#            (backend/strength_adjust_compare.py)
#   calibration  the v53 caps (chased / 1H-2H split at 68) vs the HL floor:
#            today, no chase cap, no split cap, no caps; end_days_ago 0 and 135
#            (backend/calibration_compare.py)
#   oneh     1H-only signals published every hour vs the live 1H+2H / 4h
#            setup, at a 69 and a 62 floor; end_days_ago 0 and 135
#            (backend/oneh_compare.py; ~30-45 min)
#   hourly   the live engine checked every hour, off-slot 69+ signals opened
#            on HL as extras (at 69, at 75, or after a 15-point jump) vs live
#            4h only; end_days_ago 0 and 135
#            (backend/hourly_topup_compare.py; ~30-45 min)
#   prejump  sub-69 coins at a publish that read 69+ within 3h: which signs
#            at the publish (squeeze, volume, pressing the high, score rising,
#            1H leading 2H, BTC with it) pick them, and does entering at the
#            publish pay; end_days_ago 0 and 135
#            (backend/prejump_study.py; ~30-45 min)
#   indicators  each strength-score section (RSI, MACD, EMA/SuperTrend,
#            Bollinger, patterns, combos, caps, brakes) vs trade outcomes, by
#            half and by situation (coin trend, volatility, BTC trend);
#            end_days_ago 0 and 135 (backend/indicator_study.py; ~20-30 min)
#   reweight the score changes the indicator study backed in both periods
#            (engulfing x1.5, liquidity grab + RSI divergence x0.5, CVD x0.5,
#            low-volatility -5) on the live HL book; end_days_ago 0 and 135
#            (backend/reweight_compare.py; ~20-30 min)
#   recent   the last `days` (use 10) of 4h publishes replayed, slot by slot,
#            next to what live recorded (read with APP_URL + CRON_SECRET):
#            69+ signals, what the v53 caps held under the floor, and the
#            live-vs-replay strength gap (backend/recent_signals.py; ~5-10 min)
#   market-lean  the 8 AM update's 1D / 1W market lean (coins' reads added
#            up) over the last 730 daily closes vs the next day / week's
#            basket and BTC returns, by half (backend/market_lean_study.py;
#            ~30-60 min)
#   channel-exits  the channel's exit plan (3 targets 50/30/20, stop to entry
#            at TP1) vs alternatives (2 targets, BE at 1R, all at TP1, HL's
#            plan) on the published top 3, all strengths and 69+; end_days_ago
#            0 and 135 (backend/channel_exit_compare.py; ~30-45 min)
#   recency  front-loaded recency (a fresh divergence / RSI top-bottom counts
#            most, less each close after) vs today's, on the live HL book;
#            end_days_ago 0 and 135 (backend/recency_compare.py; ~30-45 min)
#   weekly-trend  the 8 AM update's weekly market lean (all coins' 1W reads)
#            as an HL filter: dock trades against it, skip them (always or only
#            on a strong lean), or boost trades with it, on the live HL book;
#            end_days_ago 0 and 135 (backend/weekly_trend_compare.py; ~20-30 min)
#   divergence  RSI divergence by the book: its points count only near 30/70,
#            only after a break of structure, both, or not at all, on the live
#            HL book; end_days_ago 0 and 135
#            (backend/divergence_gate_compare.py; ~20-30 min)
#   ema-flat  the 9/21 EMA rules: skip or dock signals on flat 2H EMA 9/21
#            lines, or score the short cross on EMA 9 instead of 7, on the live
#            HL book (low-vol dock included); end_days_ago 0 and 135
#            (backend/ema_flat_compare.py; ~20-30 min)
#   breakout-volume  fake breakouts: pattern-breakout points by the break's
#            volume (weak 0, strong x1.25) and liquidity grabs only on
#            above-average volume, on the live HL book (low-vol dock
#            included); end_days_ago 0 and 135
#            (backend/breakout_volume_compare.py; ~20-30 min)
#   vwap-whipsaw  "flat VWAP, price crossing = no trade": on a reading whose
#            close crossed VWAP 3+ (or 4+) times in 10 candles, a new cross
#            scores 0 or VWAP scores nothing, on the live HL book (low-vol dock
#            included); end_days_ago 0 and 135
#            (backend/vwap_whipsaw_compare.py; ~20-30 min)
#   combos   indicator COMBINATIONS on the daily chart: the engine run on
#            every coin's daily closes (~4 years), each score section and how
#            the last candles closed as features; pairs / triples that called
#            the next 1 / 3 / 7 days in both halves, vs a placebo
#            (backend/combo_study.py; ~20-40 min; `days` is ignored)
#   daily-setups  the combos study's daily setups (wide day closing at the
#            high + confirmation; daily flag break + confirmation) boosting /
#            docking the 4h signals for the next day or 3 days, on the live
#            HL book (low-vol dock included); end_days_ago 0 and 135
#            (backend/daily_setup_compare.py; ~20-30 min)
#   setup-exits  hold longer when a daily setup agrees: HL trades within 3
#            days of a setup their way aim at TP3 or ride a runner (entry stop
#            or 3 / 7 days), with a control running the runner on every trade;
#            end_days_ago 0 and 135 (backend/setup_exit_compare.py; ~20-30 min)
#   scalp    15m scalping: the engine on 12 liquid coins' 15m candles at every
#            15m close, traded the HL way with HL fees; strength floor, 1H
#            agreement and max hold as variants; end_days_ago 0 and 135
#            (backend/scalp_compare.py; use days 60; ~20-30 min)
#   entry-15m  15m entries for the live HL signals: a limit on a 0.25R / 0.5R
#            pullback, at the 15m EMA 21, or after a 15m close its way, waiting
#            1-2h, else skip or market; v54 exits; end_days_ago 0 and 135
#            (backend/entry_15m_compare.py; ~20-30 min)
#   sweep-fvg  the 3-step ICT scalp on 15m: liquidity sweep -> fair value gap
#            -> limit entry in the gap, stop under the sweep, target the swing
#            beyond; gap top / mid, R:R 1.5 / 2, the engine reads (1H, 15m,
#            both or none) agreeing; end_days_ago 0
#            and 135 (backend/sweep_fvg_compare.py; use days 60; ~5-15 min)
#   scalp-struct  15m scalps with the engine's direction and structure exits
#            (stop beyond the last swing, target the next), sweep/FVG as a +10
#            bonus or an alternative trigger, $25 and risk-sized (market-cap
#            leverage) P&L; end_days_ago 0 and 135
#            (backend/scalp_struct_compare.py; use days 60; ~20-30 min)
#   scalp-chop  the LIVE 15m scalp rules with a chop filter: no new scalp while
#            BTC's 1H Choppiness Index is high (61.8 / 55) or the coin's 1H
#            ADX is low (20 / 25), or both; end_days_ago 0 and 135
#            (backend/scalp_chop_compare.py; use days 60; ~20-30 min)
#   scalp-trend  the live 15m book on trending coins only (1H ADX 25+), plus a
#            higher score floor, ADX 30, the 1H read required, a 2R target and
#            combinations; end_days_ago 0 and 135
#            (backend/scalp_trend_compare.py; use days 60; ~20-30 min)
#   scalp-sma  the live 15m book (ADX 25+) with the 15m SMA 200: a +10 bounce
#            bonus, longs above / shorts below it, both, and the bounce as its
#            own setup; end_days_ago 0 and 135
#            (backend/scalp_sma_compare.py; use days 60; ~20-30 min)
#   scalp-entry  the live 15m signals entered on a PULLBACK (limit at the 15m
#            EMA 20, or 0.3R / 0.5R back) instead of at market, and FADED
#            (stretched 85+ signals, or every signal, traded the other way);
#            end_days_ago 0 and 135 (backend/scalp_entry_compare.py; ~20-30 min)
#   scalp-reversal  the live 15m signals with the owner's fixed exits, and more
#            weight on FRESH (last 3 candles) oversold bottoms / overbought tops,
#            Fib 0.618-0.786 zone, RSI divergence and S/R: +10 / +5 a read, 1+ /
#            2+ required, or 2+ as their own setup; end_days_ago 0 and 135
#            (backend/scalp_reversal_compare.py; ~20-30 min)
#   scalp-smc  the full smart-money sequence on 15m: sweep -> CHoCH -> BOS ->
#            FVG, limit in the gap, stop beyond the sweep, 1.5R / 2R / 3R, vs the
#            plain sweep -> FVG; pure price action; end_days_ago 0 and 135
#            (backend/scalp_smc_compare.py; ~5 min)
#   scalp-score  the 15m scalp score before / after the Nov 1 review (explicit
#            15M tables, capped context): score distribution and trades at
#            85 / 90 / 100 / 110 with the live fixed exits; end_days_ago 0 and
#            135 (backend/scalp_score_compare.py; ~45-60 min, two engine passes)
#   scalp-div-gate  15m scalp: divergence only at an oversold bottom /
#            overbought top, before vs after, at 90 / 95 / 100 with the live
#            exits; end_days_ago 0 and 135 (backend/scalp_div_gate_compare.py)
#   scalp-flow  15m order flow from real taker volume (flow push, the same
#            with the candle-shape estimate, faded, CVD divergence, absorption
#            candle) with the live exits, each vs a matched random-direction
#            baseline; end_days_ago 0, 65 and 135 (backend/scalp_flow_compare.py;
#            ~5-10 min)
#   scalp-amd  15m AMD / Power of 3: Asia range, a London (or NY) sweep that
#            closes back inside, trade the other way; live or own exits, vs a
#            matched random-direction baseline; end_days_ago 0, 65 and 135
#            (backend/scalp_amd_compare.py; ~5 min)
#   close-picks  the 1D / business-week / crypto-week top fives replayed over
#            540 days of closes (candle engine + the live selection), settled
#            by the live tracker's rules, per third of the window, vs a matched
#            random-direction baseline; `days` / `end_days_ago` are ignored
#            (backend/close_picks_compare.py; ~25-40 min)
#   close-picks-funding  the same, run twice: candles only, then with each
#            close's funding from Binance's monthly archives
#            (backend/close_picks_compare.py --funding; ~45-70 min)
#   confluence  multi-timeframe confluence zones (swings, fibs, EMAs, previous
#            H / L / O from 1H to 1M, clustered): does price bounce more at a
#            touched zone than at a random level? end_days_ago 0, 65 and 135
#            (backend/confluence_study.py; ~5 min)
#   rsi-retest  daily RSI oversold-bottom markers that price comes back to: with
#            RSI lower / similar / higher than at the bottom, what followed
#            (3 / 7 / 14d, low broken, +10% vs -10% first) vs an ordinary day,
#            older vs newer half; ~1500 days, `days` / `end_days_ago` ignored
#            (backend/rsi_retest_study.py; ~3 min)
#   reversal-audit  every daily swing low (high) in a 15%+ down (up) trend,
#            confirmed 3 days later and graded only by what follows (+10% vs
#            -10% first): what the engine scored, which score parts tell real
#            turns from false ones, which to raise / lower; ~1500 days,
#            `days` / `end_days_ago` ignored (backend/reversal_audit.py; ~10 min)
#   reversal-tuning  the reversal audit once per set of the engine's tuning
#            switches (today's engine, A, B, C, D, A+B+C): how well each
#            set's call separates real turns from false ones (~40-60 min)
#   close-picks-tuning  the 540-day close-picks replay once per tuning set,
#            side by side per period (~60-90 min)
#   close-picks-d-check  today's engine vs tuning D on the 540 days BEFORE the
#            close-picks-tuning window (an unseen check; ~25-35 min)
#   close-picks-regime  the close picks over ~3 years tagged by market condition
#            at each close (BTC vs 200-day, BTC 50/200, BTC ADX, the coin vs its
#            200-day) and filters on them vs all picks, per 180-day period and
#            half, vs random direction (backend/close_regime_study.py; ~60 min)
#   close-picks-regime-2022  the same on the unseen Oct 2021 - Oct 2023 window
#            (the 2022 bear market): does the rule found later - no shorts while
#            BTC < 200-day - hold? (~40 min)
#   reversal-score  a combined score of the reversal audit's weak tells: per
#            score, how many confirmed turns were real, on the audit's window
#            (in-sample) and the 1000 days before it (unseen, the real test)
#            (backend/reversal_score_study.py; ~15-25 min)
#   scalp-portfolio  the 15m scalp book as a portfolio with the Nov 2026
#            execution rules (portfolio limits, stop-out re-entry, adds off,
#            entry quality), baseline vs each change vs all; end_days_ago 0, 65,
#            135 and the UNTOUCHED 200 (backend/scalp_portfolio_compare.py;
#            ~30-45 min, one engine pass)
#   scalp-vs-random  does the live 15m scalp score pick the right DIRECTION
#            more often than a coin flip on the same entries? (score floors,
#            entry quality, reversed); end_days_ago 0, 135, 270 and the
#            never-read 480 (backend/scalp_score_vs_random.py; ~30-45 min)
#   scalp-fade  PRE-REGISTERED: trade AGAINST the live 15m score >= 100 with
#            1.5 x ATR stop / target, $5 risk; pass = profit, PF >= 1.15 and
#            beats random on BOTH never-read periods end_days_ago 550 and 620
#            (backend/scalp_fade_compare.py; ~30-45 min)
#   htf-vs-random  PRE-REGISTERED: do the 1H (hourly) and the live 4-hourly
#            engine signals beat a coin flip on direction, with 1.5 x ATR
#            stop / target and $5 risk? never-read periods end_days_ago 700
#            and 800 (backend/htf_vs_random.py; ~1-2 h, 60 days)
#   htf-confirm  PRE-REGISTERED confirmation: the 4-hourly signal at strength
#            >= 62, 1.5 x 4H ATR stop / target, $5 risk; pass = profit, PF >=
#            1.15, beats random AND always-long on BOTH never-read periods
#            end_days_ago 900 and 1000 (backend/htf_confirm.py; ~30-60 min)
#   range-vs-random  PRE-REGISTERED: do range-box deviations (trade to the
#            opposite edge) and held breaks (trade with them) beat a coin flip
#            on the 4H and 1D charts? 365 days, never-read periods
#            end_days_ago 0 and 400 (backend/range_vs_random.py; ~30-60 min,
#            the days input is ignored)
#   pattern-outcomes  every CONFIRMED chart-pattern breakout (flags, double
#            tops/bottoms, H&S, triangles, wedges) replayed with the live
#            detectors on 4H (720d) and 1D/1W (2000d): target hit vs stop vs
#            open, against each pattern's random-walk chance; slices learned on
#            discovery and checked on the last 365 days
#            (backend/pattern_outcome_study.py; ~40-90 min, days input ignored)
#   radar-against  PRE-REGISTERED: should a 4-hourly trade (strength >= 62)
#            be skipped when the Reversal Radar (elevated / high) fights it?
#            same trades as htf-confirm; supported only if on BOTH end_days_ago
#            0 and 180 (90 days each) those trades lose, have a lower PF and
#            skipping them makes more $ (backend/radar_against_test.py;
#            ~40-90 min, set days 90)
#   short-radar  PRE-REGISTERED confirmation: (A) skip SHORTS into a bottoming
#            Reversal Radar (elevated / high)? (B) is the 4-hourly signal at 62+
#            worse than random? never-read windows end_days_ago 90 and 270
#            (backend/short_radar_confirm.py; ~40-90 min, set days 90)
#   trend-filter  PRE-REGISTERED: does the 4-hourly signal (62+) only work
#            when the coin's 4H ADX(14) >= 25 (trending)? never-read windows
#            end_days_ago 360 and 540, 90 days each
#            (backend/trend_filter_test.py; ~40-90 min, set days 90)
#   reversal-1d  PRE-REGISTERED: on 1D, when the Reversal Radar turns elevated /
#            high or a reversal chart pattern confirms, does trading the
#            reversal beat the opposite way? 1:1 at 1.5 ATR, max 20 days;
#            older vs last 365 days must agree (backend/reversal_1d_test.py;
#            ~40-80 min, the days input is ignored)
#   reversal-factors  PRE-REGISTERED: on 1D, RSI divergence, CHoCH, liquidity
#            grab, SuperTrend flip, engulfing (and a re-check of reversal
#            patterns) - trade the signal or the opposite? one trade per factor
#            per coin per 20 days (backend/reversal_factors_1d.py; ~40-80 min)
#   tao-case  PRE-REGISTERED: on 1D, the engine SHORT 62+ while the Reversal
#            Radar says bottoming (elevated/high) - take the short or the long?
#            live generate_signal + real Fear & Greed history; one per coin per
#            20 days (backend/tao_case_1d_test.py; ~40-80 min)
#   continuation-short  PRE-REGISTERED confirmation on fresh history (before
#            the TAO-case window, ~2018 to early 2021): 1D SHORT 62+ while
#            stretched below EMA50 / riding the lower band - does the short
#            win? (backend/continuation_short_confirm.py; ~30-60 min)
#   regime-switch  PRE-REGISTERED: trade the 1D engine signal (62+) only WITH
#            the regime (BTC above / below its 200-day average)? must hold in
#            2018-2021 AND 2022-now (backend/regime_switch_test.py; ~40-90 min)
#   stoch-cross  PRE-REGISTERED: on 1D, the Stoch RSI bull cross (oversold)
#            and bear cross (overbought) - trade the cross or the opposite?
#            (backend/stoch_cross_test.py; ~40-80 min)
#   target-hit  PRE-REGISTERED: after a high-chance pattern reaches its target,
#            does price reverse or continue? 4H (720d) + 1D/1W (2000d), both
#            periods must agree (backend/target_hit_test.py; ~60-120 min)
#   range-retest  PRE-REGISTERED: does a held retest of the broken edge
#            confirm a range break (better than a plain break) on 4H / 1D?
#            (backend/range_retest_test.py; ~60-120 min)
#   pattern-agree  PRE-REGISTERED: should a high-chance 1D reversal pattern
#            push the 1D signal (62+) its way? agree vs oppose, 2018-2021 and
#            2022-now (backend/pattern_agree_test.py; ~60-120 min)
#   target-trend  PRE-REGISTERED: a WITH-TREND high-chance pattern reaches its
#            target (e.g. a bearish one in a downtrend) - does the reversal
#            trade win now? both periods (backend/target_trend_test.py;
#            ~60-120 min)
#   funding-extreme  PRE-REGISTERED: do funding extremes (Hyperliquid funding,
#            z >= 2 vs the coin's own last 90 days) mark tops and bottoms? the
#            contrarian trade vs the crowd's, both periods
#            (backend/funding_extreme_test.py; ~40-70 min)
#   hl-liq-check  live check of the Hyperliquid liquidation clusters
#            (backend/hl_liq_check.py; result to Telegram only; ~3 min)
#   volume-profile  PRE-REGISTERED: do 30-day value-area edges (VAL / VAH) make
#            1D price reverse? both periods (backend/volume_profile_test.py)
#   volume-profile-4h  PRE-REGISTERED out-of-sample: do 4H value-area edges BREAK
#            (break side >= 53%, z >= 2, both periods)?
#   scalp-lean-filter  PRE-REGISTERED: the live 15m scalp (100+, session, live
#            exits) with the previous day's money lean as a filter; end_days_ago 0 and 135
#   scalp-lean-threshold  PRE-REGISTERED: with the lean filter, can the scalp
#            threshold come down to 95 / 90? end_days_ago 0 and 135
#   exit-rules  PRE-REGISTERED: early exits for open 1D trades (opposite 62+ / 51+
#            signal, break-even after +0.5R) vs none, both eras
#   amdx  PRE-REGISTERED: after the London AMD, does the NY afternoon (16-21 UTC)
#            reverse or continue the distribution? two 90-day halves
#   weekly-leans  PRE-REGISTERED: do the money leans help 1W alt signals?
#   risk-leans  PRE-REGISTERED: US dollar + Nasdaq, altcoin breadth vs BTC, hash
#            ribbons as market-wide leans, both eras (backend/risk_lean_test.py)
#   macro-leans  PRE-REGISTERED: Coinbase premium, stablecoin supply, Fear & Greed
#            extremes as market-wide leans, both eras (backend/macro_lean_test.py)
#   polymarket-check  live check of the Polymarket odds read (to Telegram only)
#   order-blocks  PRE-REGISTERED: does price reverse at the first return into a
#            fresh 1D order block? both periods (backend/order_block_test.py)
#   strength-tier  PRE-REGISTERED: the 1D book at 69+ (Confirmed) only vs 62+:
#            69+ >= 0.03R a trade better than 62-68 and itself an edge, both
#            eras (backend/strength_tier_test.py; ~20-40 min)
#   tp-reached-1w  the same on WEEKLY closes (1W signal, 1.5 x 1W ATR, max 20
#            weeks; 20+ resolved per era)
#   tp-reached  PRE-REGISTERED: after a 1D signal's TP1 was reached, is the next
#            same-way 62+ signal weaker (>= 5 pts fewer wins, less per trade)
#            in 2018-2021 AND 2022-now? (backend/tp_reached_test.py; ~60-120 min)
#   score-cleanup  PRE-REGISTERED: the 1D signal (62+) with the points of the
#            factors that tested as no edge removed - no worse per trade and
#            still beating a coin flip in 2018-2021 and 2022-now?
#            (backend/score_cleanup_test.py; ~60-120 min)
#   ipo-btc  PRE-REGISTERED: does BTC fall into big IPOs? BTC 50 days into /
#            18 days after / day 18-70 around 12 large IPOs since 2019 vs every
#            date, SpaceX shown but not counted (backend/ipo_btc_study.py; ~2 min)
#   close-record  the published close picks' LIVE record (read with APP_URL +
#            CRON_SECRET) vs a random-direction baseline; also every Monday
#            from close-record.yml (backend/close_record.py; ~2 min)
#
# All use HL auto-exec's rules (strength >= min_strength, one position per coin).
#
# This repo is public, so its Actions logs are too: the job prints only how
# many coins were replayed and whether the message was sent, never a result.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN       the same bot as the app
#   TELEGRAM_REPORT_CHAT_ID  your private chat id (never the channel)
#
# Manual only: Actions tab -> Strategy backtests -> Run workflow. ~20-45 min.

on:
  workflow_dispatch:
    inputs:
      study:
        description: "Which backtest"
        type: choice
        options: [cadence, stops, entry-exit, combined, v54-oos, universe, rr, reads, read-filters, factors, strength, calibration, oneh, hourly, prejump, indicators, reweight, recent, market-lean, weekly-trend, recency, channel-exits, divergence, ema-flat, breakout-volume, vwap-whipsaw, combos, daily-setups, setup-exits, scalp, entry-15m, sweep-fvg, scalp-struct, scalp-chop, scalp-trend, scalp-sma, scalp-entry, scalp-reversal, scalp-smc, scalp-score, scalp-flow, scalp-amd, close-picks, close-picks-funding, close-record, confluence, rsi-retest, reversal-audit, reversal-tuning, close-picks-tuning, close-picks-d-check, close-picks-regime, close-picks-regime-2022, reversal-score, scalp-portfolio, scalp-vs-random, scalp-fade, htf-vs-random, htf-confirm, range-vs-random, pattern-outcomes, ipo-btc, radar-against, short-radar, trend-filter, reversal-1d, reversal-factors, tao-case, continuation-short, regime-switch, stoch-cross, target-hit, range-retest, pattern-agree, target-trend, funding-extreme, score-cleanup, hl-liq-check, scalp-div-gate, tp-reached, tp-reached-1w, strength-tier, order-blocks, volume-profile, volume-profile-4h, polymarket-check, macro-leans, risk-leans, scalp-lean-filter, weekly-leans, amdx, scalp-lean-threshold, exit-rules]
        default: cadence
      days:
        description: "Days of history to replay"
        default: "90"
      min_strength:
        description: "HL auto-exec threshold (HL_AUTO_MIN_STRENGTH)"
        default: "62"
      end_days_ago:
        description: "v54-oos / universe / rr / read-filters / strength / calibration / oneh / hourly / prejump / indicators / reweight / weekly-trend / recency / channel-exits / divergence / ema-flat / breakout-volume / vwap-whipsaw / daily-setups / setup-exits / scalp / entry-15m / sweep-fvg / scalp-struct / scalp-chop / scalp-trend / scalp-sma / scalp-entry / scalp-reversal / scalp-smc / scalp-score / scalp-flow / scalp-amd / confluence / scalp-portfolio / scalp-vs-random / scalp-fade / htf-vs-random / htf-confirm: end the history this many days ago (0 = now)"
        default: "135"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 240           # the tuning studies replay six engine variants
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fail in seconds, not after a 25-minute replay, when the secrets aren't
      # visible to Actions (added as Variables, Environment, Codespaces or
      # Dependabot secrets, or under another name).
      - name: Check the Telegram secrets are set
        env:
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
        run: |
          missing=""
          [ -n "$TELEGRAM_BOT_TOKEN" ] || missing="$missing TELEGRAM_BOT_TOKEN"
          [ -n "$TELEGRAM_REPORT_CHAT_ID" ] || missing="$missing TELEGRAM_REPORT_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings -> Secrets and variables -> Actions -> Secrets tab -> New repository secret."
            exit 1
          fi
          echo "Telegram secrets present"

      - name: Run the backtest and send to private Telegram
        working-directory: backend
        env:
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          # optional: more private chats (comma-separated) that get a copy
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
          # The tools import app for its symbol list; keep its slot pre-warm
          # thread from waking up inside a long run.
          DISABLE_REC_SCHEDULER:   "1"
          # recent: reads the live app's recorded signals (never printed)
          APP_URL:                 ${{ secrets.APP_URL }}
          CRON_SECRET:             ${{ secrets.CRON_SECRET }}
          STUDY:                   ${{ inputs.study }}
          DAYS:                    ${{ inputs.days }}
          MIN_STRENGTH:            ${{ inputs.min_strength }}
          END_DAYS_AGO:            ${{ inputs.end_days_ago }}
        run: |
          EXTRA=""
          case "$STUDY" in
            stops) MODULE=stop_compare ;;
            entry-exit) MODULE=entry_exit_compare ;;
            combined) MODULE=combined_compare ;;
            v54-oos) MODULE=combined_compare
                     EXTRA="--fixed --end-days-ago $END_DAYS_AGO" ;;
            universe) MODULE=universe_compare
                      EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            rr) MODULE=rr_compare
                EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            read-filters) MODULE=read_filter_compare
                          EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            strength) MODULE=strength_adjust_compare
                      EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            calibration) MODULE=calibration_compare
                         EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            oneh) MODULE=oneh_compare
                  EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            hourly) MODULE=hourly_topup_compare
                    EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            prejump) MODULE=prejump_study
                     EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            indicators) MODULE=indicator_study
                        EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            reweight) MODULE=reweight_compare
                      EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            weekly-trend) MODULE=weekly_trend_compare
                          EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            recency) MODULE=recency_compare
                     EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            channel-exits) MODULE=channel_exit_compare
                           EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            divergence) MODULE=divergence_gate_compare
                        EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            ema-flat) MODULE=ema_flat_compare
                      EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            breakout-volume) MODULE=breakout_volume_compare
                             EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            vwap-whipsaw) MODULE=vwap_whipsaw_compare
                          EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            daily-setups) MODULE=daily_setup_compare
                          EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            setup-exits) MODULE=setup_exit_compare
                         EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp) MODULE=scalp_compare
                   EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            entry-15m) MODULE=entry_15m_compare
                       EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            sweep-fvg) MODULE=sweep_fvg_compare
                       EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-struct) MODULE=scalp_struct_compare
                          EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-chop) MODULE=scalp_chop_compare
                        EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-trend) MODULE=scalp_trend_compare
                         EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-sma) MODULE=scalp_sma_compare
                       EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-entry) MODULE=scalp_entry_compare
                         EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-reversal) MODULE=scalp_reversal_compare
                            EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-smc) MODULE=scalp_smc_compare
                       EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-score) MODULE=scalp_score_compare
                         EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-div-gate) MODULE=scalp_div_gate_compare
                         EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-lean-filter) MODULE=scalp_lean_filter_compare
                         EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-lean-threshold) MODULE=scalp_lean_filter_compare
                         EXTRA="--thresholds --end-days-ago $END_DAYS_AGO" ;;
            scalp-flow) MODULE=scalp_flow_compare
                        EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-amd) MODULE=scalp_amd_compare
                       EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            trend-filter) MODULE=trend_filter_test
                          EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            short-radar) MODULE=short_radar_confirm
                         EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            radar-against) MODULE=radar_against_test
                           EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            htf-confirm) MODULE=htf_confirm
                         EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            htf-vs-random) MODULE=htf_vs_random
                           EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-fade) MODULE=scalp_fade_compare
                        EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-vs-random) MODULE=scalp_score_vs_random
                             EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-portfolio) MODULE=scalp_portfolio_compare
                             EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            confluence) MODULE=confluence_study
                        EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            *)     MODULE=cadence_compare ;;
          esac
          # Output is only per-coin download counts and
          # "coins replayed: N; telegram: sent|NOT sent". No results.
          if [ "$STUDY" = "market-lean" ]; then
            python -m market_lean_study --telegram --days 730
          elif [ "$STUDY" = "recent" ]; then
            python -m recent_signals --telegram --days "$DAYS"
          elif [ "$STUDY" = "reads" ]; then
            python -m read_study --telegram --days 1500
          elif [ "$STUDY" = "combos" ]; then
            python -m combo_study --telegram --days 1500
          elif [ "$STUDY" = "close-picks" ]; then
            python -m close_picks_compare --telegram --days 540
          elif [ "$STUDY" = "close-picks-funding" ]; then
            python -m close_picks_compare --telegram --days 540 --funding
          elif [ "$STUDY" = "reversal-tuning" ]; then
            python -m reversal_audit --telegram --days 1500 --tunings=-,A,B,C,D,ABC
          elif [ "$STUDY" = "close-picks-tuning" ]; then
            python -m close_picks_compare --telegram --days 540 --tunings=-,A,B,C,D,ABC
          elif [ "$STUDY" = "close-picks-d-check" ]; then
            python -m close_picks_compare --telegram --days 540 --end-days-ago 540 --tunings=-,D
          elif [ "$STUDY" = "close-picks-regime-2022" ]; then
            python -m close_regime_study --telegram --days 720 --end-days-ago 1080
          elif [ "$STUDY" = "reversal-score" ]; then
            python -m reversal_score_study --telegram --days 1500 --unseen-days 1000
          elif [ "$STUDY" = "close-picks-regime" ]; then
            python -m close_regime_study --telegram --days 1080
          elif [ "$STUDY" = "reversal-audit" ]; then
            python -m reversal_audit --telegram --days 1500
          elif [ "$STUDY" = "rsi-retest" ]; then
            python -m rsi_retest_study --telegram --days 1500
          elif [ "$STUDY" = "close-record" ]; then
            python -m close_record --telegram
          elif [ "$STUDY" = "hl-liq-check" ]; then
            python -m hl_liq_check --telegram --wallets 1200 --budget 175
          elif [ "$STUDY" = "exit-rules" ]; then
            python -m exit_rule_test --telegram --days 3400
          elif [ "$STUDY" = "amdx" ]; then
            python -m amdx_test --telegram --fetch-days 180
          elif [ "$STUDY" = "weekly-leans" ]; then
            python -m weekly_lean_test --telegram --days 3400
          elif [ "$STUDY" = "risk-leans" ]; then
            python -m risk_lean_test --telegram --days 3400
          elif [ "$STUDY" = "macro-leans" ]; then
            python -m macro_lean_test --telegram --days 3400
          elif [ "$STUDY" = "volume-profile-4h" ]; then
            python -m volume_profile_test --telegram --tf 4H --h4-days 720
          elif [ "$STUDY" = "volume-profile" ]; then
            python -m volume_profile_test --telegram --days 2000
          elif [ "$STUDY" = "polymarket-check" ]; then
            python -m polymarket_check --telegram
          elif [ "$STUDY" = "order-blocks" ]; then
            python -m order_block_test --telegram --days 2000
          elif [ "$STUDY" = "strength-tier" ]; then
            python -m strength_tier_test --telegram --days 3400
          elif [ "$STUDY" = "tp-reached-1w" ]; then
            python -m tp_reached_test --telegram --days 3400 --tf 1W
          elif [ "$STUDY" = "tp-reached" ]; then
            python -m tp_reached_test --telegram --days 3400
          elif [ "$STUDY" = "score-cleanup" ]; then
            python -m score_cleanup_test --telegram --days 3400
          elif [ "$STUDY" = "funding-extreme" ]; then
            python -m funding_extreme_test --telegram --days 1300
          elif [ "$STUDY" = "target-trend" ]; then
            python -m target_trend_test --telegram --days 2000 --h4-days 720
          elif [ "$STUDY" = "pattern-agree" ]; then
            python -m pattern_agree_test --telegram --days 3400
          elif [ "$STUDY" = "range-retest" ]; then
            python -m range_retest_test --telegram --days 2000 --h4-days 720
          elif [ "$STUDY" = "target-hit" ]; then
            python -m target_hit_test --telegram --days 2000 --h4-days 720
          elif [ "$STUDY" = "stoch-cross" ]; then
            python -m stoch_cross_test --telegram --days 2000
          elif [ "$STUDY" = "regime-switch" ]; then
            python -m regime_switch_test --telegram --days 3400
          elif [ "$STUDY" = "continuation-short" ]; then
            python -m continuation_short_confirm --telegram --days 3400
          elif [ "$STUDY" = "tao-case" ]; then
            python -m tao_case_1d_test --telegram --days 2000
          elif [ "$STUDY" = "reversal-factors" ]; then
            python -m reversal_factors_1d --telegram --days 2000
          elif [ "$STUDY" = "reversal-1d" ]; then
            python -m reversal_1d_test --telegram --days 2000
          elif [ "$STUDY" = "ipo-btc" ]; then
            python -m ipo_btc_study --telegram
          elif [ "$STUDY" = "pattern-outcomes" ]; then
            python -m pattern_outcome_study --telegram --days 2000 --h4-days 720
          elif [ "$STUDY" = "range-vs-random" ]; then
            python -m range_vs_random --telegram --fetch-days 365 --end-days-ago "$END_DAYS_AGO"
          elif [ "$STUDY" = "factors" ]; then
            python -m factor_study --telegram --fetch-days 260
          else
            python -m "$MODULE" --telegram \
              --fetch-days "$DAYS" --min-strength "$MIN_STRENGTH" $EXTRA
          fi
