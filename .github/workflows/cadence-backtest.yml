name: Strategy backtests (private Telegram)

# Offline backtests of the live strategy, sent to the owner's PRIVATE Telegram
# chat (TELEGRAM_REPORT_CHAT_ID). Pick one with the `study` input:
#
#   cadence  would publishing / executing every 1h or 2h beat today's 4h?
#            (backend/cadence_compare.py)
#   stops    are v53's stops too tight? Same trades, stop moved further out
#            (x1.25, x1.5, x2, +0.5 / +1 ATR) plus how many stop-outs reached
#            TP1 afterwards (backend/stop_compare.py)
#   entry-exit  block trades against the Fibonacci pocket / where structure
#            fought the trade, and try exit shapes (30/70, stop to entry at 1R,
#            no break-even, all at TP1, all at TP2), executed the way HL does
#            (backend/entry_exit_compare.py)
#   combined  the best exit + stop together, with realistic HL costs (limit
#            take-profits too), split into 62-68 / 69+ signal strength
#            (backend/combined_compare.py)
#   v54-oos  out-of-sample check: today vs the FIXED v54 candidate on an
#            earlier period that ends `end_days_ago` days back (default 135,
#            so it doesn't overlap the run that picked v54)
#            (backend/combined_compare.py --fixed)
#   universe  more coins (the browse-only ones too) and/or every 69+ signal per
#            slot instead of the top 3, under HL's caps and without them; set
#            end_days_ago to 0 and to 135 for both periods
#            (backend/universe_compare.py; ~35-50 min with the extra coins)
#
# All use HL auto-exec's rules (strength >= min_strength, one position per coin).
#
# This repo is public, so its Actions logs are too: the job prints only how
# many coins were replayed and whether the message was sent, never a result.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN       the same bot as the app
#   TELEGRAM_REPORT_CHAT_ID  your private chat id (never the channel)
#
# Manual only: Actions tab -> Strategy backtests -> Run workflow. ~20-45 min.

on:
  workflow_dispatch:
    inputs:
      study:
        description: "Which backtest"
        type: choice
        options: [cadence, stops, entry-exit, combined, v54-oos, universe]
        default: cadence
      days:
        description: "Days of history to replay"
        default: "90"
      min_strength:
        description: "HL auto-exec threshold (HL_AUTO_MIN_STRENGTH)"
        default: "62"
      end_days_ago:
        description: "v54-oos / universe: end the history this many days ago (0 = now)"
        default: "135"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fail in seconds, not after a 25-minute replay, when the secrets aren't
      # visible to Actions (added as Variables, Environment, Codespaces or
      # Dependabot secrets, or under another name).
      - name: Check the Telegram secrets are set
        env:
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
        run: |
          missing=""
          [ -n "$TELEGRAM_BOT_TOKEN" ] || missing="$missing TELEGRAM_BOT_TOKEN"
          [ -n "$TELEGRAM_REPORT_CHAT_ID" ] || missing="$missing TELEGRAM_REPORT_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings -> Secrets and variables -> Actions -> Secrets tab -> New repository secret."
            exit 1
          fi
          echo "Telegram secrets present"

      - name: Run the backtest and send to private Telegram
        working-directory: backend
        env:
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          # The tools import app for its symbol list; keep its slot pre-warm
          # thread from waking up inside a long run.
          DISABLE_REC_SCHEDULER:   "1"
          STUDY:                   ${{ inputs.study }}
          DAYS:                    ${{ inputs.days }}
          MIN_STRENGTH:            ${{ inputs.min_strength }}
          END_DAYS_AGO:            ${{ inputs.end_days_ago }}
        run: |
          EXTRA=""
          case "$STUDY" in
            stops) MODULE=stop_compare ;;
            entry-exit) MODULE=entry_exit_compare ;;
            combined) MODULE=combined_compare ;;
            v54-oos) MODULE=combined_compare
                     EXTRA="--fixed --end-days-ago $END_DAYS_AGO" ;;
            universe) MODULE=universe_compare
                      EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            *)     MODULE=cadence_compare ;;
          esac
          # Output is only per-coin download counts and
          # "coins replayed: N; telegram: sent|NOT sent". No results.
          python -m "$MODULE" --telegram \
            --fetch-days "$DAYS" --min-strength "$MIN_STRENGTH" $EXTRA
