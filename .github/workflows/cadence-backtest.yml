name: Strategy backtests (private Telegram)

# Offline backtests of the live strategy, sent to the owner's PRIVATE Telegram
# chat (TELEGRAM_REPORT_CHAT_ID). Pick one with the `study` input:
#
#   cadence  would publishing / executing every 1h or 2h beat today's 4h?
#            (backend/cadence_compare.py)
#   stops    are v53's stops too tight? Same trades, stop moved further out
#            (x1.25, x1.5, x2, +0.5 / +1 ATR) plus how many stop-outs reached
#            TP1 afterwards (backend/stop_compare.py)
#   entry-exit  block trades against the Fibonacci pocket / where structure
#            fought the trade, and try exit shapes (30/70, stop to entry at 1R,
#            no break-even, all at TP1, all at TP2), executed the way HL does
#            (backend/entry_exit_compare.py)
#   combined  the best exit + stop together, with realistic HL costs (limit
#            take-profits too), split into 62-68 / 69+ signal strength
#            (backend/combined_compare.py)
#   v54-oos  out-of-sample check: today vs the FIXED v54 candidate on an
#            earlier period that ends `end_days_ago` days back (default 135,
#            so it doesn't overlap the run that picked v54)
#            (backend/combined_compare.py --fixed)
#   universe  more coins (the browse-only ones too) and/or every 69+ signal per
#            slot instead of the top 3, under HL's caps and without them; set
#            end_days_ago to 0 and to 135 for both periods
#            (backend/universe_compare.py; ~35-50 min with the extra coins)
#   rr       the live setup's reward-to-risk: no ATR widening, TPs scaled with
#            the stop, a minimum reward at the fill (0.5/0.8/1R), and risk-based
#            position sizing; set end_days_ago to 0 and to 135 for both periods
#            (backend/rr_compare.py)
#   reads    event study of the Daily Market Update reads: what each 1D / 1W
#            read (and a star confluence) did over the next 1-14 days, against
#            an ordinary day; ~4 years of daily history (backend/read_study.py)
#   read-filters  the event study's findings as filters on the live HL book
#            (no longs on a 1D forming bullish divergence / after a 1D cross
#            below EMA 50, no shorts on 2+ bullish weekly reads, weekly-backed
#            longs first); set end_days_ago to 0 and to 135
#            (backend/read_filter_compare.py)
#   factors  trade-outcome factor study: every candidate over ~260 days, v54
#            execution, ~25 factors known at entry WITH vs WITHOUT in each
#            half; only factors consistent in both are reported as candidates
#            (backend/factor_study.py; ~40-60 min)
#   strength  the factor study's consistent factors as strength changes on the
#            live HL book; set end_days_ago to 0 and to 135
#            (backend/strength_adjust_compare.py)
#   calibration  the v53 caps (chased / 1H-2H split at 68) vs the HL floor:
#            today, no chase cap, no split cap, no caps; end_days_ago 0 and 135
#            (backend/calibration_compare.py)
#   oneh     1H-only signals published every hour vs the live 1H+2H / 4h
#            setup, at a 69 and a 62 floor; end_days_ago 0 and 135
#            (backend/oneh_compare.py; ~30-45 min)
#   hourly   the live engine checked every hour, off-slot 69+ signals opened
#            on HL as extras (at 69, at 75, or after a 15-point jump) vs live
#            4h only; end_days_ago 0 and 135
#            (backend/hourly_topup_compare.py; ~30-45 min)
#   prejump  sub-69 coins at a publish that read 69+ within 3h: which signs
#            at the publish (squeeze, volume, pressing the high, score rising,
#            1H leading 2H, BTC with it) pick them, and does entering at the
#            publish pay; end_days_ago 0 and 135
#            (backend/prejump_study.py; ~30-45 min)
#   indicators  each strength-score section (RSI, MACD, EMA/SuperTrend,
#            Bollinger, patterns, combos, caps, brakes) vs trade outcomes, by
#            half and by situation (coin trend, volatility, BTC trend);
#            end_days_ago 0 and 135 (backend/indicator_study.py; ~20-30 min)
#   reweight the score changes the indicator study backed in both periods
#            (engulfing x1.5, liquidity grab + RSI divergence x0.5, CVD x0.5,
#            low-volatility -5) on the live HL book; end_days_ago 0 and 135
#            (backend/reweight_compare.py; ~20-30 min)
#   recent   the last `days` (use 10) of 4h publishes replayed, slot by slot,
#            next to what live recorded (read with APP_URL + CRON_SECRET):
#            69+ signals, what the v53 caps held under the floor, and the
#            live-vs-replay strength gap (backend/recent_signals.py; ~5-10 min)
#   market-lean  the 8 AM update's 1D / 1W market lean (coins' reads added
#            up) over the last 730 daily closes vs the next day / week's
#            basket and BTC returns, by half (backend/market_lean_study.py;
#            ~30-60 min)
#   channel-exits  the channel's exit plan (3 targets 50/30/20, stop to entry
#            at TP1) vs alternatives (2 targets, BE at 1R, all at TP1, HL's
#            plan) on the published top 3, all strengths and 69+; end_days_ago
#            0 and 135 (backend/channel_exit_compare.py; ~30-45 min)
#   recency  front-loaded recency (a fresh divergence / RSI top-bottom counts
#            most, less each close after) vs today's, on the live HL book;
#            end_days_ago 0 and 135 (backend/recency_compare.py; ~30-45 min)
#   weekly-trend  the 8 AM update's weekly market lean (all coins' 1W reads)
#            as an HL filter: dock trades against it, skip them (always or only
#            on a strong lean), or boost trades with it, on the live HL book;
#            end_days_ago 0 and 135 (backend/weekly_trend_compare.py; ~20-30 min)
#   divergence  RSI divergence by the book: its points count only near 30/70,
#            only after a break of structure, both, or not at all, on the live
#            HL book; end_days_ago 0 and 135
#            (backend/divergence_gate_compare.py; ~20-30 min)
#   ema-flat  the 9/21 EMA rules: skip or dock signals on flat 2H EMA 9/21
#            lines, or score the short cross on EMA 9 instead of 7, on the live
#            HL book (low-vol dock included); end_days_ago 0 and 135
#            (backend/ema_flat_compare.py; ~20-30 min)
#   breakout-volume  fake breakouts: pattern-breakout points by the break's
#            volume (weak 0, strong x1.25) and liquidity grabs only on
#            above-average volume, on the live HL book (low-vol dock
#            included); end_days_ago 0 and 135
#            (backend/breakout_volume_compare.py; ~20-30 min)
#   vwap-whipsaw  "flat VWAP, price crossing = no trade": on a reading whose
#            close crossed VWAP 3+ (or 4+) times in 10 candles, a new cross
#            scores 0 or VWAP scores nothing, on the live HL book (low-vol dock
#            included); end_days_ago 0 and 135
#            (backend/vwap_whipsaw_compare.py; ~20-30 min)
#   combos   indicator COMBINATIONS on the daily chart: the engine run on
#            every coin's daily closes (~4 years), each score section and how
#            the last candles closed as features; pairs / triples that called
#            the next 1 / 3 / 7 days in both halves, vs a placebo
#            (backend/combo_study.py; ~20-40 min; `days` is ignored)
#   daily-setups  the combos study's daily setups (wide day closing at the
#            high + confirmation; daily flag break + confirmation) boosting /
#            docking the 4h signals for the next day or 3 days, on the live
#            HL book (low-vol dock included); end_days_ago 0 and 135
#            (backend/daily_setup_compare.py; ~20-30 min)
#   setup-exits  hold longer when a daily setup agrees: HL trades within 3
#            days of a setup their way aim at TP3 or ride a runner (entry stop
#            or 3 / 7 days), with a control running the runner on every trade;
#            end_days_ago 0 and 135 (backend/setup_exit_compare.py; ~20-30 min)
#   scalp    15m scalping: the engine on 12 liquid coins' 15m candles at every
#            15m close, traded the HL way with HL fees; strength floor, 1H
#            agreement and max hold as variants; end_days_ago 0 and 135
#            (backend/scalp_compare.py; use days 60; ~20-30 min)
#   entry-15m  15m entries for the live HL signals: a limit on a 0.25R / 0.5R
#            pullback, at the 15m EMA 21, or after a 15m close its way, waiting
#            1-2h, else skip or market; v54 exits; end_days_ago 0 and 135
#            (backend/entry_15m_compare.py; ~20-30 min)
#   sweep-fvg  the 3-step ICT scalp on 15m: liquidity sweep -> fair value gap
#            -> limit entry in the gap, stop under the sweep, target the swing
#            beyond; gap top / mid, R:R 1.5 / 2, the engine reads (1H, 15m,
#            both or none) agreeing; end_days_ago 0
#            and 135 (backend/sweep_fvg_compare.py; use days 60; ~5-15 min)
#   scalp-struct  15m scalps with the engine's direction and structure exits
#            (stop beyond the last swing, target the next), sweep/FVG as a +10
#            bonus or an alternative trigger, $25 and risk-sized (market-cap
#            leverage) P&L; end_days_ago 0 and 135
#            (backend/scalp_struct_compare.py; use days 60; ~20-30 min)
#   scalp-chop  the LIVE 15m scalp rules with a chop filter: no new scalp while
#            BTC's 1H Choppiness Index is high (61.8 / 55) or the coin's 1H
#            ADX is low (20 / 25), or both; end_days_ago 0 and 135
#            (backend/scalp_chop_compare.py; use days 60; ~20-30 min)
#   scalp-trend  the live 15m book on trending coins only (1H ADX 25+), plus a
#            higher score floor, ADX 30, the 1H read required, a 2R target and
#            combinations; end_days_ago 0 and 135
#            (backend/scalp_trend_compare.py; use days 60; ~20-30 min)
#   scalp-sma  the live 15m book (ADX 25+) with the 15m SMA 200: a +10 bounce
#            bonus, longs above / shorts below it, both, and the bounce as its
#            own setup; end_days_ago 0 and 135
#            (backend/scalp_sma_compare.py; use days 60; ~20-30 min)
#   scalp-entry  the live 15m signals entered on a PULLBACK (limit at the 15m
#            EMA 20, or 0.3R / 0.5R back) instead of at market, and FADED
#            (stretched 85+ signals, or every signal, traded the other way);
#            end_days_ago 0 and 135 (backend/scalp_entry_compare.py; ~20-30 min)
#   scalp-reversal  the live 15m signals with the owner's fixed exits, and more
#            weight on FRESH (last 3 candles) oversold bottoms / overbought tops,
#            Fib 0.618-0.786 zone, RSI divergence and S/R: +10 / +5 a read, 1+ /
#            2+ required, or 2+ as their own setup; end_days_ago 0 and 135
#            (backend/scalp_reversal_compare.py; ~20-30 min)
#
# All use HL auto-exec's rules (strength >= min_strength, one position per coin).
#
# This repo is public, so its Actions logs are too: the job prints only how
# many coins were replayed and whether the message was sent, never a result.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN       the same bot as the app
#   TELEGRAM_REPORT_CHAT_ID  your private chat id (never the channel)
#
# Manual only: Actions tab -> Strategy backtests -> Run workflow. ~20-45 min.

on:
  workflow_dispatch:
    inputs:
      study:
        description: "Which backtest"
        type: choice
        options: [cadence, stops, entry-exit, combined, v54-oos, universe, rr, reads, read-filters, factors, strength, calibration, oneh, hourly, prejump, indicators, reweight, recent, market-lean, weekly-trend, recency, channel-exits, divergence, ema-flat, breakout-volume, vwap-whipsaw, combos, daily-setups, setup-exits, scalp, entry-15m, sweep-fvg, scalp-struct, scalp-chop, scalp-trend, scalp-sma, scalp-entry, scalp-reversal]
        default: cadence
      days:
        description: "Days of history to replay"
        default: "90"
      min_strength:
        description: "HL auto-exec threshold (HL_AUTO_MIN_STRENGTH)"
        default: "62"
      end_days_ago:
        description: "v54-oos / universe / rr / read-filters / strength / calibration / oneh / hourly / prejump / indicators / reweight / weekly-trend / recency / channel-exits / divergence / ema-flat / breakout-volume / vwap-whipsaw / daily-setups / setup-exits / scalp / entry-15m / sweep-fvg / scalp-struct / scalp-chop / scalp-trend / scalp-sma / scalp-entry / scalp-reversal: end the history this many days ago (0 = now)"
        default: "135"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fail in seconds, not after a 25-minute replay, when the secrets aren't
      # visible to Actions (added as Variables, Environment, Codespaces or
      # Dependabot secrets, or under another name).
      - name: Check the Telegram secrets are set
        env:
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
        run: |
          missing=""
          [ -n "$TELEGRAM_BOT_TOKEN" ] || missing="$missing TELEGRAM_BOT_TOKEN"
          [ -n "$TELEGRAM_REPORT_CHAT_ID" ] || missing="$missing TELEGRAM_REPORT_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings -> Secrets and variables -> Actions -> Secrets tab -> New repository secret."
            exit 1
          fi
          echo "Telegram secrets present"

      - name: Run the backtest and send to private Telegram
        working-directory: backend
        env:
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          # optional: more private chats (comma-separated) that get a copy
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
          # The tools import app for its symbol list; keep its slot pre-warm
          # thread from waking up inside a long run.
          DISABLE_REC_SCHEDULER:   "1"
          # recent: reads the live app's recorded signals (never printed)
          APP_URL:                 ${{ secrets.APP_URL }}
          CRON_SECRET:             ${{ secrets.CRON_SECRET }}
          STUDY:                   ${{ inputs.study }}
          DAYS:                    ${{ inputs.days }}
          MIN_STRENGTH:            ${{ inputs.min_strength }}
          END_DAYS_AGO:            ${{ inputs.end_days_ago }}
        run: |
          EXTRA=""
          case "$STUDY" in
            stops) MODULE=stop_compare ;;
            entry-exit) MODULE=entry_exit_compare ;;
            combined) MODULE=combined_compare ;;
            v54-oos) MODULE=combined_compare
                     EXTRA="--fixed --end-days-ago $END_DAYS_AGO" ;;
            universe) MODULE=universe_compare
                      EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            rr) MODULE=rr_compare
                EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            read-filters) MODULE=read_filter_compare
                          EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            strength) MODULE=strength_adjust_compare
                      EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            calibration) MODULE=calibration_compare
                         EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            oneh) MODULE=oneh_compare
                  EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            hourly) MODULE=hourly_topup_compare
                    EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            prejump) MODULE=prejump_study
                     EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            indicators) MODULE=indicator_study
                        EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            reweight) MODULE=reweight_compare
                      EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            weekly-trend) MODULE=weekly_trend_compare
                          EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            recency) MODULE=recency_compare
                     EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            channel-exits) MODULE=channel_exit_compare
                           EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            divergence) MODULE=divergence_gate_compare
                        EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            ema-flat) MODULE=ema_flat_compare
                      EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            breakout-volume) MODULE=breakout_volume_compare
                             EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            vwap-whipsaw) MODULE=vwap_whipsaw_compare
                          EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            daily-setups) MODULE=daily_setup_compare
                          EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            setup-exits) MODULE=setup_exit_compare
                         EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp) MODULE=scalp_compare
                   EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            entry-15m) MODULE=entry_15m_compare
                       EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            sweep-fvg) MODULE=sweep_fvg_compare
                       EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-struct) MODULE=scalp_struct_compare
                          EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-chop) MODULE=scalp_chop_compare
                        EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-trend) MODULE=scalp_trend_compare
                         EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-sma) MODULE=scalp_sma_compare
                       EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-entry) MODULE=scalp_entry_compare
                         EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            scalp-reversal) MODULE=scalp_reversal_compare
                            EXTRA="--end-days-ago $END_DAYS_AGO" ;;
            *)     MODULE=cadence_compare ;;
          esac
          # Output is only per-coin download counts and
          # "coins replayed: N; telegram: sent|NOT sent". No results.
          if [ "$STUDY" = "market-lean" ]; then
            python -m market_lean_study --telegram --days 730
          elif [ "$STUDY" = "recent" ]; then
            python -m recent_signals --telegram --days "$DAYS"
          elif [ "$STUDY" = "reads" ]; then
            python -m read_study --telegram --days 1500
          elif [ "$STUDY" = "combos" ]; then
            python -m combo_study --telegram --days 1500
          elif [ "$STUDY" = "factors" ]; then
            python -m factor_study --telegram --fetch-days 260
          else
            python -m "$MODULE" --telegram \
              --fetch-days "$DAYS" --min-strength "$MIN_STRENGTH" $EXTRA
          fi
