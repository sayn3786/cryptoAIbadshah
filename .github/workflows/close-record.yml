name: Close picks live record (private Telegram)

# Every Monday: the published 1D / business-week / crypto-week picks' live
# record (the tracker's outcomes, and the finished picks re-settled vs a
# random-direction baseline) to the owner's PRIVATE Telegram chat
# (TELEGRAM_REPORT_CHAT_ID). This repo is public, so its Actions logs are
# too: the job prints only how many picks it read and whether the send
# worked, never the results. Manual run: Actions tab -> Run workflow.

on:
  schedule:
    - cron: "41 3 * * 1"          # Mondays 03:41 UTC, after the Monday closes
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send the live record to private Telegram
        working-directory: backend
        env:
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
          DISABLE_REC_SCHEDULER:   "1"
          APP_URL:                 ${{ secrets.APP_URL }}
          CRON_SECRET:             ${{ secrets.CRON_SECRET }}
        run: python -m close_record --telegram
