# Used by Cloudflare's GitHub builds (root directory cloudflare/hl-manage-worker)
# and by the Wrangler CLI (`npx wrangler deploy` from this directory).
# HL_MANAGE_TOKEN and SCHEDULER_TOKEN are SECRETS set in the dashboard (or
# `wrangler secret put`); secrets survive deploys, plain dashboard variables do not.
name = "cryptoaibadshah"   # must match the Worker name in Cloudflare
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false          # no public URL; the Worker runs only on its cron

[vars]
APP_URL = "https://cryptomarket-sigma.vercel.app"

[triggers]
crons = ["* * * * *"]        # every minute; worker.js picks the jobs due

# Keep persisted job results enabled across GitHub deployments. Dashboard-only
# changes are otherwise replaced by this configuration on the next deploy.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
